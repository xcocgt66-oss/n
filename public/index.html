<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --user-msg: #3b82f6;
            --ai-msg: #334155;
        }
        body {
            background-color: white; /* الشاشة البيضاء التمويهية */
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: background-color 0.5s ease;
        }
        #app-container {
            display: none;
            width: 100%;
            max-width: 1000px;
            margin: 3vh auto;
            height: 94vh;
            background: var(--panel-bg);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            flex-direction: column;
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .header {
            padding: 20px 30px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.8);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            backdrop-filter: blur(10px);
        }
        .header-title {
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 12px #10b981;
        }
        select {
            background: #0f172a;
            color: white;
            border: 1px solid #334155;
            padding: 10px 15px;
            border-radius: 10px;
            outline: none;
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        select:focus { border-color: var(--accent); }
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }
        /* تنسيق السكرول بار */
        #chat-box::-webkit-scrollbar { width: 8px; }
        #chat-box::-webkit-scrollbar-track { background: transparent; }
        #chat-box::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        .message {
            max-width: 85%;
            padding: 18px 24px;
            border-radius: 16px;
            line-height: 1.7;
            position: relative;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            font-size: 1.05rem;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-msg {
            background: var(--user-msg);
            align-self: flex-start;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.2);
        }
        .ai-msg {
            background: var(--ai-msg);
            align-self: flex-end;
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .input-area {
            padding: 20px 30px;
            background: rgba(15, 23, 42, 0.6);
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            gap: 15px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        input[type="text"] {
            flex: 1;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 1.05rem;
            outline: none;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .file-upload-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
            z-index: 2;
        }
        .file-icon {
            background: #334155;
            padding: 0 20px;
            height: 100%;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.2s;
        }
        .file-upload-wrapper:hover .file-icon { background: #475569; }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0 30px;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        .loading-dots {
            display: flex;
            gap: 6px;
            padding: 10px 5px;
        }
        .dot {
            width: 8px; height: 8px; background: #94a3b8; border-radius: 50%;
            animation: pulse 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes pulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
        .image-preview {
            max-width: 250px;
            border-radius: 10px;
            margin-top: 15px;
            display: block;
            border: 2px solid rgba(255,255,255,0.1);
        }
        /* دعم تنسيق الأكواد البرمجية */
        pre {
            background: #0f172a;
            padding: 16px;
            border-radius: 10px;
            overflow-x: auto;
            border: 1px solid #334155;
            direction: ltr;
            text-align: left;
            margin: 10px 0;
        }
        code {
            font-family: 'Consolas', 'Monaco', monospace;
            color: #e2e8f0;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <div class="header">
            <div class="header-title">
                <div class="status-dot"></div>
                <span>Terminal.AI</span>
            </div>
            <select id="modelSelect">
                <option value="gemini-1.5-flash">Gemini 1.5 Flash (سريع جداً + صور)</option>
                <option value="gemini-1.5-pro">Gemini 1.5 Pro (برمجة وتحليل معقد)</option>
            </select>
        </div>
        <div id="chat-box"></div>
        <div class="input-area">
            <div class="file-upload-wrapper">
                <div class="file-icon" id="fileIndicator">📎</div>
                <input type="file" id="imageInput" accept="image/*" onchange="updateFileIcon()">
            </div>
            <input type="text" id="promptInput" placeholder="اكتب أمرك هنا..." onkeypress="handleEnter(event)" autocomplete="off">
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        let yCount = 0;
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('app-container').style.display !== 'flex') {
                if (e.key.toLowerCase() === 'y') {
                    yCount++;
                    if (yCount === 5) {
                        document.body.style.backgroundColor = 'var(--bg-color)';
                        document.getElementById('app-container').style.display = 'flex';
                        document.getElementById('promptInput').focus();
                    }
                } else {
                    yCount = 0;
                }
            }
        });

        function updateFileIcon() {
            const file = document.getElementById('imageInput').files[0];
            const indicator = document.getElementById('fileIndicator');
            if (file) {
                indicator.innerHTML = '🖼️';
                indicator.style.background = '#10b981';
                indicator.style.color = '#fff';
            } else {
                indicator.innerHTML = '📎';
                indicator.style.background = '#334155';
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function formatMarkdown(text) {
            // تنسيق الأكواد (Code Blocks)
            let formatted = text.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
            // تنسيق الكود المضمن (Inline Code)
            formatted = formatted.replace(/`([^`]+)`/g, '<code style="background:#0f172a;padding:3px 6px;border-radius:6px;border:1px solid #334155;color:#38bdf8;">$1</code>');
            // التغميق (Bold)
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong style="color:#fff;">$1</strong>');
            return formatted.replace(/\n/g, '<br>');
        }

        async function sendMessage() {
            const prompt = document.getElementById('promptInput').value;
            const imageFile = document.getElementById('imageInput').files[0];
            const model = document.getElementById('modelSelect').value;
            const chatBox = document.getElementById('chat-box');

            if (!prompt && !imageFile) return;

            let userMsgHTML = prompt;
            if (imageFile) {
                const fileURL = URL.createObjectURL(imageFile);
                userMsgHTML += `<br><img src="${fileURL}" class="image-preview">`;
            }
            
            chatBox.innerHTML += `<div class="message user-msg">${userMsgHTML}</div>`;
            
            document.getElementById('promptInput').value = '';
            document.getElementById('imageInput').value = '';
            updateFileIcon();
            chatBox.scrollTop = chatBox.scrollHeight;

            const formData = new FormData();
            formData.append('prompt', prompt);
            formData.append('model', model);
            if (imageFile) formData.append('image', imageFile);

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `
                <div class="message ai-msg" id="${loadingId}">
                    <div class="loading-dots">
                        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                    </div>
                </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/api/chat', { method: 'POST', body: formData });
                const data = await response.json();
                
                document.getElementById(loadingId).remove();
                
                if (data.error) {
                    chatBox.innerHTML += `<div class="message ai-msg" style="border-right: 4px solid #ef4444;"><strong>خطأ سيرفر:</strong><br>${data.error}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="message ai-msg">${formatMarkdown(data.response)}</div>`;
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="message ai-msg" style="border-right: 4px solid #ef4444;"><strong>فشل الاتصال:</strong><br>تأكد من إعدادات Railway ومفتاح API.</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
