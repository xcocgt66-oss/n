<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <!-- مكتبات لتنسيق الأكواد والنصوص -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root {
            --bg-main: #212121;
            --bg-chat: #2f2f2f;
            --text-main: #ececec;
            --accent: #10a37f;
            --accent-hover: #1a7f64;
            --border-color: rgba(255,255,255,0.1);
        }
        
        body {
            background-color: white; /* شاشة التمويه البيضاء */
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            transition: background-color 0.4s ease;
        }

        #app-container {
            display: none;
            height: 100vh;
            width: 100vw;
            background: var(--bg-main);
            color: var(--text-main);
            flex-direction: column;
            position: relative;
        }

        /* رأس الصفحة (Header) */
        .header {
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-main);
            z-index: 10;
        }

        .header h1 {
            font-size: 1.1rem;
            margin: 0;
            font-weight: 600;
        }

        select {
            background: var(--bg-chat);
            color: white;
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            border-radius: 8px;
            font-family: inherit;
            outline: none;
            cursor: pointer;
        }

        /* منطقة الشات */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            scroll-behavior: smooth;
        }
        
        #chat-container::-webkit-scrollbar { width: 6px; }
        #chat-container::-webkit-scrollbar-thumb { background: #555; border-radius: 10px; }

        .message-wrapper {
            width: 100%;
            max-width: 800px;
            margin-bottom: 30px;
            display: flex;
            gap: 20px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        
        .user-avatar { background: #555; }
        .ai-avatar { background: var(--accent); }

        .message-content {
            flex: 1;
            line-height: 1.6;
            font-size: 1rem;
            overflow-x: auto;
        }

        /* تنسيق الأكواد (Markdown) */
        .message-content pre {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            direction: ltr;
            border: 1px solid var(--border-color);
        }
        
        .message-content p { margin-top: 0; }
        
        .uploaded-image-preview {
            max-width: 300px;
            border-radius: 8px;
            margin-top: 10px;
            border: 1px solid var(--border-color);
        }

        /* منطقة الإدخال (Input Area) */
        .input-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
        }

        .input-box {
            background: var(--bg-chat);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            transition: border-color 0.3s;
        }
        
        .input-box:focus-within { border-color: rgba(255,255,255,0.4); }

        /* منطقة إظهار الصورة المرفوعة قبل الإرسال */
        #attachment-preview {
            display: none;
            padding: 10px;
            position: relative;
            width: fit-content;
        }
        #attachment-preview img {
            height: 60px;
            border-radius: 8px;
        }
        .remove-image {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            cursor: pointer;
            font-size: 12px;
        }

        .input-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 1rem;
            resize: none;
            max-height: 200px;
            padding: 10px 0;
            outline: none;
            font-family: inherit;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: #ccc;
            cursor: pointer;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .action-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        .send-btn { background: var(--text-main); color: var(--bg-main); }
        .send-btn:hover { background: #d1d5db; }

        /* واجهة السحب والإفلات */
        #drag-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(33, 33, 33, 0.9);
            border: 4px dashed var(--accent);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: var(--accent);
            border-radius: 20px;
            margin: 20px;
        }

        /* نقطة التحميل */
        .typing-indicator { display: flex; gap: 5px; padding: 10px 0; }
        .typing-indicator span {
            width: 8px; height: 8px; background: #888; border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="drag-overlay">أفلت الصورة هنا 🖼️</div>
        
        <div class="header">
            <h1>Studio AI</h1>
            <select id="modelSelect">
                <option value="gemini-1.5-pro">Gemini 1.5 Pro (الأذكى برمجياً)</option>
                <option value="gemini-1.5-flash">Gemini 1.5 Flash (الأسرع)</option>
            </select>
        </div>

        <div id="chat-container"></div>

        <div class="input-container">
            <div class="input-box">
                <div id="attachment-preview">
                    <img id="preview-img" src="" alt="preview">
                    <button class="remove-image" onclick="removeImage()">×</button>
                </div>
                <div class="input-row">
                    <label class="action-btn" style="cursor: pointer;" title="إرفاق صورة">
                        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                    </label>
                    
                    <textarea id="promptInput" rows="1" placeholder="أرسل رسالة..." oninput="autoResize(this)" onkeydown="handleEnter(event)"></textarea>
                    
                    <button class="action-btn send-btn" onclick="sendMessage()" title="إرسال">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // إعدادات Markdown
        marked.setOptions({
            highlight: function(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            }
        });

        // 1. نظام الحماية (الشاشة البيضاء)
        let yCount = 0;
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('app-container').style.display !== 'flex') {
                if (e.key.toLowerCase() === 'y') {
                    yCount++;
                    if (yCount === 5) {
                        document.body.style.backgroundColor = 'var(--bg-main)';
                        document.getElementById('app-container').style.display = 'flex';
                        document.getElementById('promptInput').focus();
                    }
                } else {
                    yCount = 0;
                }
            }
        });

        // 2. نظام السحب والإفلات للصور
        const appContainer = document.getElementById('app-container');
        const dragOverlay = document.getElementById('drag-overlay');
        const imageInput = document.getElementById('imageInput');

        appContainer.addEventListener('dragover', (e) => {
            e.preventDefault();
            dragOverlay.style.display = 'flex';
        });

        appContainer.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dragOverlay.style.display = 'none';
        });

        appContainer.addEventListener('drop', (e) => {
            e.preventDefault();
            dragOverlay.style.display = 'none';
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                imageInput.files = e.dataTransfer.files;
                handleFileSelect({ target: imageInput });
            }
        });

        // 3. معاينة وحذف الصورة
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('preview-img').src = e.target.result;
                    document.getElementById('attachment-preview').style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            imageInput.value = '';
            document.getElementById('attachment-preview').style.display = 'none';
        }

        // 4. تمدد مربع النص التلقائي
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight) + 'px';
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        // 5. إرسال الرسالة
        async function sendMessage() {
            const prompt = document.getElementById('promptInput').value.trim();
            const imageFile = imageInput.files[0];
            const model = document.getElementById('modelSelect').value;
            const chatBox = document.getElementById('chat-container');

            if (!prompt && !imageFile) return;

            // عرض رسالة المستخدم
            let userContent = prompt;
            if (imageFile) {
                const imgUrl = URL.createObjectURL(imageFile);
                userContent += `<br><img src="${imgUrl}" class="uploaded-image-preview">`;
            }

            chatBox.innerHTML += `
                <div class="message-wrapper" style="flex-direction: row-reverse;">
                    <div class="avatar user-avatar">U</div>
                    <div class="message-content" style="direction: rtl;">${userContent}</div>
                </div>`;

            // إعادة تعيين الإدخال
            document.getElementById('promptInput').value = '';
            document.getElementById('promptInput').style.height = 'auto';
            removeImage();
            window.scrollTo(0, document.body.scrollHeight);
            chatBox.scrollTop = chatBox.scrollHeight;

            const formData = new FormData();
            formData.append('prompt', prompt);
            formData.append('model', model);
            if (imageFile) formData.append('image', imageFile);

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `
                <div class="message-wrapper" id="${loadingId}">
                    <div class="avatar ai-avatar">✨</div>
                    <div class="message-content">
                        <div class="typing-indicator"><span></span><span></span><span></span></div>
                    </div>
                </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/api/chat', { method: 'POST', body: formData });
                const data = await response.json();
                
                const loadingDiv = document.getElementById(loadingId);
                
                if (data.error) {
                    loadingDiv.innerHTML = `<div class="avatar ai-avatar" style="background:#ef4444;">!</div><div class="message-content" style="color:#ef4444;">${data.error}</div>`;
                } else {
                    // تحويل الماركدوان إلى HTML حقيقي وتطبيق الألوان على الأكواد
                    const htmlResponse = marked.parse(data.response);
                    loadingDiv.innerHTML = `<div class="avatar ai-avatar">✨</div><div class="message-content" style="direction: rtl;">${htmlResponse}</div>`;
                }
            } catch (err) {
                document.getElementById(loadingId).innerHTML = `<div class="avatar ai-avatar" style="background:#ef4444;">!</div><div class="message-content" style="color:#ef4444;">فشل الاتصال بالسيرفر.</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
